name: 기능 요청
description: 있었으면 하는 기능이나 바꿨으면 하는 점
title: "[요청] "
labels: ["enhancement"]
body:
  - type: textarea
    id: want
    attributes:
      label: 무엇이 있었으면 좋겠나요?
      placeholder: 예) 압축할 때 암호를 걸 수 있으면 좋겠어요.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 어떤 때 필요한가요?
      placeholder: 예) 거래처에 견적서를 보낼 때요.
